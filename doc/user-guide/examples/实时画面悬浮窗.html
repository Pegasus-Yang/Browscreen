<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>browscreen · 实时画面悬浮窗示例</title>
  <style>
    body { margin: 0; min-height: 160vh; background: #f8fafc; color: #202632; font-family: system-ui, sans-serif; }
    main { max-width: 720px; margin: auto; padding: 32px 24px; }
    h1 { font-size: 24px; }
    p { line-height: 1.7; }
    code { background: #e5e7eb; padding: 2px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>实时画面悬浮窗示例</h1>
    <p>先启动 browscreen，确认浏览器能打开服务预览页，再将下面的 <code>iframe</code> 代码复制到自己的页面中。</p>
    <p>将 <code>src</code> 改为浏览器可访问的服务根地址。默认连接本机 <code>http://127.0.0.1:8000/</code>；窗口复用服务预览页的自动刷新和状态提示。</p>
    <p>滚动此页，悬浮窗仍固定在页面右下角。窗口是只读预览，鼠标和键盘操作不会转发给目标浏览器。</p>
  </main>

  <!-- 修改 src 为当前浏览器可访问的 browscreen 服务根地址。 -->
  <iframe
    id="browscreen-preview-window"
    src="http://127.0.0.1:8000/"
    title="browscreen 实时画面（只读）"
    style="
      position: fixed; right: 16px; bottom: 16px;
      width: min(420px, calc(100% - 32px));
      height: min(400px, calc(100% - 32px));
      box-sizing: border-box; z-index: 10000;
      border: 1px solid #d1d5db; border-radius: 8px;
      background: #f3f4f6; box-shadow: 0 4px 20px #0002;
    "
  ></iframe>
</body>
</html>
