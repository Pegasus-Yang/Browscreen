[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "browscreen"
version = "0.3.2"
description = "Live browser viewport screenshots, pointer overlays, and optional video recording"
readme = { file = "README.en.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Pegasus-Yang", email = "panesas2@gmail.com" }]
dependencies = [
  "fastapi>=0.118,<1",
  "uvicorn>=0.37,<1",
  "pydantic>=2.12,<3",
  "websockets>=15,<18",
  "httpx>=0.28,<1",
  "pillow>=12,<13",
]

[project.optional-dependencies]
video = ["av>=19.0.1,<20"]

[project.urls]
Homepage = "https://github.com/Pegasus-Yang/Browscreen"
Documentation = "https://github.com/Pegasus-Yang/Browscreen/blob/main/doc/README.en.md"
Repository = "https://github.com/Pegasus-Yang/Browscreen"
Issues = "https://github.com/Pegasus-Yang/Browscreen/issues"

[project.scripts]
browscreen = "browscreen.main:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/browscreen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
