<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>browscreen · 浏览器画面预览</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f4f6; color: #202632; font-family: system-ui, sans-serif; }
    header { max-width: 1320px; margin: auto; padding: 24px 20px 16px; }
    h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.5px; }
    p { margin: 4px 0; font-size: 14px; color: #5c6575; }
    #status { color: #303b50; }
    main { max-width: 1320px; margin: auto; padding: 0 20px 24px; }
    img { display: block; width: 100%; height: auto; background: white; border-radius: 6px; box-shadow: 0 2px 16px #16233a14; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>browscreen</h1>
    <p>浏览器画面预览 · 只读</p>
    <p id="status" role="status" aria-live="polite">正在等待浏览器端点可用</p>
    <p id="metadata"></p>
  </header>
  <main><img id="preview" alt="浏览器当前视口画面" hidden></main>
  <script>
    const intervalMs = __INTERVAL_MS__;
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const metadata = document.getElementById('metadata');
    const messages = {
      waiting_for_browser: '正在等待浏览器端点可用',
      screenshot_not_ready: '浏览器已连接，正在生成首帧',
      browser_wait_timeout: '等待浏览器连接超时，请修正端点后重启服务',
      capture_failed: '采集任务异常停止，请检查服务日志后重启'
    };
    const requestTimeoutMs = 5000;
    let currentUrl = null;
    let currentFrameKey = null;
    let activeRequest = null;
    let timer = null;
    let stopped = false;

    function clearPreview() {
      preview.hidden = true;
      preview.removeAttribute('src');
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentUrl = null;
      currentFrameKey = null;
      metadata.textContent = '';
    }

    function loadImage(url, signal) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        function finish(error) {
          image.onload = null;
          image.onerror = null;
          signal.removeEventListener('abort', abort);
          if (error) {
            image.removeAttribute('src');
            reject(error);
          } else {
            resolve();
          }
        }
        function abort() { finish(signal.reason); }
        image.onload = () => finish();
        image.onerror = () => finish(new Error('图片加载失败，将自动重试'));
        signal.addEventListener('abort', abort, { once: true });
        if (signal.aborted) abort();
        else image.src = url;
      });
    }

    async function poll() {
      if (stopped || activeRequest) return;
      const controller = new AbortController();
      activeRequest = controller;
      const timeout = setTimeout(() => {
        controller.abort(new Error('预览请求超时，将自动重试'));
      }, requestTimeoutMs);
      let nextUrl = null;
      try {
        const response = await fetch('/api/screenshot', { cache: 'no-store', signal: controller.signal });
        if (!response.ok) {
          const error = await response.json();
          throw new Error(messages[error.code] || '预览暂时不可用，将自动重试');
        }
        const frameId = response.headers.get('X-Frame-Id');
        const startedAt = response.headers.get('X-Capture-Started-At');
        const frameKey = frameId && startedAt ? `${frameId}/${startedAt}` : null;
        const blob = await response.blob();
        controller.signal.throwIfAborted();
        // 帧号与时间共同判断，服务重启后仍接受较小或重复的帧号。
        if (frameKey && frameKey === currentFrameKey && currentUrl) return;
        nextUrl = URL.createObjectURL(blob);
        await loadImage(nextUrl, controller.signal);
        controller.signal.throwIfAborted();
        preview.src = nextUrl;
        if (currentUrl) URL.revokeObjectURL(currentUrl);
        currentUrl = nextUrl;
        currentFrameKey = frameKey;
        nextUrl = null;
        preview.hidden = false;
        status.textContent = '画面持续更新';
        metadata.textContent = `第 ${frameId} 帧 · 采集开始 ${startedAt}`;
      } catch (error) {
        // 离开页面的取消不覆盖恢复后的状态；网络超时仍显示明确提示。
        const failure = controller.signal.aborted ? controller.signal.reason : error;
        if (!stopped && failure.name !== 'AbortError') {
          clearPreview();
          status.textContent = failure.message;
        }
      } finally {
        clearTimeout(timeout);
        if (nextUrl) URL.revokeObjectURL(nextUrl);
        activeRequest = null;
        if (!stopped) timer = setTimeout(poll, intervalMs);
      }
    }
    window.addEventListener('pagehide', () => {
      stopped = true;
      clearTimeout(timer);
      activeRequest?.abort();
      clearPreview();
    });
    window.addEventListener('pageshow', event => {
      if (!event.persisted || !stopped) return;
      stopped = false;
      status.textContent = '正在恢复预览';
      // 在途请求先完成取消清理，再由其 finally 调度，避免并行轮询。
      if (!activeRequest) poll();
    });
    poll();
  </script>
</body>
</html>
