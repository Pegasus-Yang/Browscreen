name: Package validation

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      release_tag:
        default: ''
        type: string
    outputs:
      artifact_name:
        value: ${{ jobs.validate.outputs.artifact_name }}
      version:
        value: ${{ jobs.validate.outputs.version }}
      source_commit:
        value: ${{ jobs.validate.outputs.source_commit }}
      wheel:
        value: ${{ jobs.validate.outputs.wheel }}
      sdist:
        value: ${{ jobs.validate.outputs.sdist }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact_name: distribution-${{ github.run_id }}-${{ github.run_attempt }}
      version: ${{ steps.metadata.outputs.version }}
      source_commit: ${{ steps.metadata.outputs.source_commit }}
      wheel: ${{ steps.metadata.outputs.wheel }}
      sdist: ${{ steps.metadata.outputs.sdist }}
    env:
      DIST_DIR: dist
      RELEASE_TAG: ${{ inputs.release_tag }}
      CI_METADATA_PATH: /tmp/browscreen-metadata-${{ github.run_id }}-${{ github.run_attempt }}.json
      WORKFLOW_REF: ${{ github.workflow_ref }}
      WORKFLOW_COMMIT: ${{ github.workflow_sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: 检出待验证源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: 准备 uv 与 Python 3.14
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.5'
          python-version: '3.14'
          enable-cache: true
      - name: 准备 Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: 保留锁文件的默认包源
        shell: bash
        run: |
          uv venv --python 3.14 .venv
          .venv/bin/python - <<'PY'
          import os,tomllib
          from pathlib import Path
          from urllib.parse import urlsplit
          lock=tomllib.loads(Path('uv.lock').read_text())
          registries={p['source']['registry'] for p in lock['package'] if 'registry' in p['source']}
          assert len(registries)==1,'预期锁文件只有一个默认包源'
          index=registries.pop();url=urlsplit(index)
          assert url.scheme in {'http','https'} and url.hostname and not url.username and not url.password
          assert not any(c.isspace() for c in index)
          with open(os.environ['GITHUB_ENV'],'a') as output:output.write(f'UV_DEFAULT_INDEX={index}\n')
          print(f'Preserve locked registry: {url.hostname}')
          PY
      - name: 同步锁定的开发和视频依赖
        run: uv sync --locked --group dev --all-extras --python 3.14 -i http://mirrors.aliyun.com/pypi/simple/ --trusted-host mirrors.aliyun.com
      - name: 核对版本、元数据与标签
        id: metadata
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          import importlib.metadata,json,os,re,subprocess,tomllib
          from pathlib import Path
          import browscreen
          assert not subprocess.check_output(['git','diff','--name-only','HEAD']).strip(),'源码必须与检出提交一致'
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard']).strip(),'不允许未跟踪的发行内容'
          project=tomllib.loads(Path('pyproject.toml').read_text())['project']
          version=project['version']
          assert project['name']=='browscreen' and re.fullmatch(r'\d+\.\d+\.\d+',version)
          assert importlib.metadata.version('browscreen')==version
          if hasattr(browscreen,'__version__'):assert browscreen.__version__==version
          lock=tomllib.loads(Path('uv.lock').read_text())
          assert [p['version'] for p in lock['package'] if p['name']=='browscreen']==[version]
          readme=project['readme'];readme=readme if isinstance(readme,str) else readme['file']
          if tuple(map(int,version.split('.'))) >= (0,3,2):
              assert project['readme']=={'file':'README.en.md','content-type':'text/markdown'}
              assert project['description'].isascii() and project['description'].strip()
              assert project['urls']['Documentation'].endswith('/doc/README.en.md')
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tag=os.environ.get('RELEASE_TAG','')
          if tag:
              assert tag==f'v{version}',f'Tag {tag} does not match version {version}'
              assert subprocess.check_output(['git','cat-file','-t',f'refs/tags/{tag}'],text=True).strip()=='tag','发布标签必须是附注标签'
              assert subprocess.check_output(['git','rev-parse','--verify',f'refs/tags/{tag}^{{commit}}'],text=True).strip()==commit
          data={'distribution':'browscreen','version':version,'source_commit':commit,'release_tag':tag,'description_file':readme,'wheel':f'browscreen-{version}-py3-none-any.whl','sdist':f'browscreen-{version}.tar.gz'}
          Path(os.environ['CI_METADATA_PATH']).write_text(json.dumps(data,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for key,value in data.items():output.write(f'{key}={value}\n')
          print(f'browscreen {version}; source={commit}; readme={readme}; tag={tag or "validation only"}')
          PY
      - name: 运行完整测试
        run: .venv/bin/python -m pytest -q -W error
      - name: 从源码分发包构建 wheel
        run: uv build --out-dir "$DIST_DIR" --no-sources -i http://mirrors.aliyun.com/pypi/simple/ --trusted-host mirrors.aliyun.com
      - name: Twine 严格检查
        env:
          WHEEL: ${{ steps.metadata.outputs.wheel }}
          SDIST: ${{ steps.metadata.outputs.sdist }}
        run: uv tool run --from 'twine==7.0.0' --with 'readme-renderer[md]==46.0' -i http://mirrors.aliyun.com/pypi/simple/ --trusted-host mirrors.aliyun.com twine check --strict "$DIST_DIR/$WHEEL" "$DIST_DIR/$SDIST"
      - name: 核对发行内容并全新安装验证
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          import hashlib,json,os,re,subprocess,tarfile,tempfile,tomllib,zipfile
          from email import policy
          from email.parser import BytesParser
          from pathlib import Path,PurePosixPath
          root=Path.cwd();data=json.loads(Path(os.environ['CI_METADATA_PATH']).read_text())
          project=tomllib.loads((root/'pyproject.toml').read_text())['project']
          assert not subprocess.check_output(['git','diff','--name-only','HEAD']).strip(),'测试或构建改动了检出源码'
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard']).strip()
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==data['source_commit']
          dist=root/os.environ['DIST_DIR'];wheel=dist/data['wheel'];sdist=dist/data['sdist'];version=data['version']
          assert sorted(p.name for p in dist.glob('*.whl'))==[wheel.name]
          assert sorted(p.name for p in dist.glob('*.tar.gz'))==[sdist.name]
          tracked={p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p}
          sources={p for p in tracked if p.startswith('src/browscreen/')}
          description=(root/data['description_file']).read_text()
          def metadata(raw):
              info=BytesParser(policy=policy.default).parsebytes(raw)
              assert info['Name']=='browscreen' and info['Version']==version
              assert info['Requires-Python']==project['requires-python'] and info['License-Expression']=='MIT'
              assert info['Summary']==project['description'] and info['Description-Content-Type']=='text/markdown'
              assert info.get_payload(decode=True).decode('utf-8').strip()==description.strip()
              assert set(info.get_all('Provides-Extra') or [])==set(project.get('optional-dependencies',{}))
              assert f"Documentation, {project['urls']['Documentation']}" in info.get_all('Project-URL')
          def public(name):
              path=PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert not {'.git','.venv','.uv-cache','__pycache__','local','review-evidence','acceptance-evidence','review-fix-evidence'}.intersection(path.parts),name
              assert path.suffix not in {'.pyc','.log','.har','.mp4','.mov','.webm'},name
              assert not any(p in {'.env','.cdp','.mouse'} or (p.startswith('.env.') and p!='.env.example') for p in path.parts),name
              assert not any(any(s in p for s in ('验收记录','审核报告','发布前检查记录')) for p in path.parts),name
          with zipfile.ZipFile(wheel) as archive:
              names={n for n in archive.namelist() if not n.endswith('/')}
              for name in names:public(name)
              info=f'browscreen-{version}.dist-info'
              metadata(archive.read(info+'/METADATA'))
              assert archive.read(info+'/licenses/LICENSE')==(root/'LICENSE').read_bytes()
              assert {f'src/{n}' for n in names if n.startswith('browscreen/')}==sources
              for name in sources:assert archive.read(name.removeprefix('src/'))==(root/name).read_bytes(),name
          with tarfile.open(sdist) as archive:
              prefix=f'browscreen-{version}/';members=archive.getmembers()
              assert all(m.name.startswith(prefix) for m in members)
              assert not any(m.issym() or m.islnk() for m in members)
              names={m.name.removeprefix(prefix):m for m in members if m.isfile()}
              assert sources<=set(names)
              metadata(archive.extractfile(names['PKG-INFO']).read())
              for name,member in names.items():
                  public(name)
                  if name!='PKG-INFO':
                      assert name in tracked,name
                      assert archive.extractfile(member).read()==(root/name).read_bytes(),name
          # 检查目录位于源码之外；基础安装先验证没有 PyAV，再安装同一 wheel 的 video extra。
          check=Path(tempfile.mkdtemp(prefix='browscreen-wheel-',dir=os.environ['RUNNER_TEMP']))
          python=check/'.venv/bin/python';cli=check/'.venv/bin/browscreen'
          index=['-i','http://mirrors.aliyun.com/pypi/simple/','--trusted-host','mirrors.aliyun.com']
          def run(args,**kwargs):return subprocess.run(list(map(str,args)),cwd=check,check=True,**kwargs)
          run(['uv','venv','--python','3.14',check/'.venv'])
          run(['uv','pip','install','--python',python,wheel,*index])
          probe=f"""
          from pathlib import Path
          from importlib import metadata,resources
          import sys,browscreen
          from PIL import Image
          from browscreen.app import create_app
          from browscreen.models import Settings
          assert metadata.version('browscreen')=={version!r}
          if hasattr(browscreen,'__version__'):assert browscreen.__version__=={version!r}
          assert Path(browscreen.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert 'site-packages' in browscreen.__file__
          settings=Settings(work_dir=Path.cwd(),verbose=True)
          assert settings.work_dir==Path.cwd().resolve() and settings.verbose
          assert create_app(settings=settings).openapi()['info']['version']=={version!r}
          assert '<!doctype html>' in resources.files('browscreen').joinpath('preview.html').read_text().lower()
          with resources.files('browscreen').joinpath('assets/cursor.png').open('rb') as stream:
              with Image.open(stream) as image:assert image.size==(24,32)
          assert 'av' not in sys.modules
          print('Version, site-packages, settings, OpenAPI, preview and cursor verified')
          """
          import textwrap
          probe=textwrap.dedent(probe)
          run([python,'-I','-c',probe+"\nimport importlib.util; assert importlib.util.find_spec('av') is None"])
          help_text=run([cli,'--help'],capture_output=True,text=True).stdout
          if '--version' in help_text:
              assert run([cli,'version'],capture_output=True,text=True).stdout.strip()==f'browscreen {version}'
              assert run([cli,'--version'],capture_output=True,text=True).stdout.strip()==f'browscreen {version}'
          video='video' in project.get('optional-dependencies',{})
          if video:
              assert '--record' in help_text and '--record-output' in help_text
              missing=subprocess.run([str(cli),'--work-dir',str(check),'--record'],cwd=check,capture_output=True,text=True)
              assert missing.returncode==1 and 'browscreen[video]' in missing.stderr and 'Traceback' not in missing.stderr
              run(['uv','pip','install','--python',python,f'{wheel}[video]',*index])
              run([python,'-I','-c',probe])
              recording="""
          import asyncio,io,time
          from datetime import datetime,timezone
          from pathlib import Path
          from PIL import Image
          import av
          from browscreen.models import CurrentFrame,Settings
          from browscreen.recording import VideoRecorder
          async def check():
              stream=io.BytesIO();Image.new('RGB',(320,180),'blue').save(stream,format='PNG')
              recorder=VideoRecorder(settings=Settings(work_dir=Path.cwd(),record=True,record_output=Path.cwd()/'installed-wheel.mp4'))
              await recorder.prepare();start=time.monotonic()
              for number in (1,2):
                  await recorder.append(frame=CurrentFrame(frame_id=number,capture_started_at=datetime.now(timezone.utc).isoformat(),png_bytes=stream.getvalue()),captured_at=start+(number-1)*0.3)
              await recorder.finish(stopped_at=start+0.6)
              assert recorder.closed and recorder.error is None and recorder.frame_count==2
              with av.open(str(recorder.path)) as video:
                  frames=list(video.decode(video=0))
                  assert len(frames)==2 and all((f.width,f.height)==(320,180) for f in frames)
              print('Installed video extra encoded and decoded a two-frame H.264 MP4')
          asyncio.run(check())
          """
              run([python,'-I','-c',textwrap.dedent(recording)])
          manifest={**data,'workflow_ref':os.environ.get('WORKFLOW_REF','local'),'workflow_commit':os.environ.get('WORKFLOW_COMMIT','local'),'run_url':os.environ.get('RUN_URL',''),'requires_python':project['requires-python'],'video_extra_verified':video,'real_browser_acceptance':False,'validation':'full pytest; Twine strict; source/archive comparison; fresh base and video wheel install; CLI/settings/OpenAPI/resources; optional MP4 encode/decode','files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in (wheel,sdist)}}
          (dist/'release-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          assets=[wheel,sdist,dist/'release-manifest.json']
          (dist/'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in assets))
          changelog=(root/'changelog.md').read_text()
          section=re.search(r'^## '+re.escape(version)+r'\b.*?(?=^## |\Z)',changelog,re.M|re.S)
          changes=section.group(0).strip() if section else ''
          notes=f'# browscreen {version}\n\n{changes}\n\nSource: `{data["source_commit"]}`. Description: `{data["description_file"]}`.\n\nAttachments: wheel, sdist, SHA256SUMS, release-manifest.json. Full tests and fresh wheel installation verified. Real Chrome acceptance is separate. This workflow does not upload to PyPI.\n\n[Validation run]({manifest["run_url"]})\n'
          (dist/'release-notes.md').write_text(notes)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:
              output.write(f'## browscreen {version}\n\nSource: `{data["source_commit"]}`\n\nDescription: `{data["description_file"]}`\n\n```text\n'+(dist/'SHA256SUMS').read_text()+'```\n\nFull tests and fresh wheel installation passed. Real Chrome acceptance was not run. No PyPI upload.\n')
          print(f'Validated {version}; files frozen at {dist}')
          PY
      - name: 保存同一次验证的构建产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DIST_DIR }}/
          if-no-files-found: error
          retention-days: 14
